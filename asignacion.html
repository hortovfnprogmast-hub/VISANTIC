<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Especificación de Tarea de Código</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --success: #10b981;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 2rem 1rem;
  }
  .container {
    background: var(--card);
    width: 100%;
    max-width: 640px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    padding: 2.5rem;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 0.5rem;
  }
  .subtitle {
    color: var(--muted);
    margin-bottom: 2rem;
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .form-group {
    margin-bottom: 1.5rem;
  }
  label {
    display: block;
    font-weight: 600;
    margin-bottom: 0.5rem;
    font-size: 0.9rem;
  }
  .required::after {
    content: " *";
    color: #ef4444;
  }
  input[type="text"],
  input[type="email"],
  select,
  textarea {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 0.95rem;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: #fff;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
  }
  textarea { resize: vertical; min-height: 120px; }
  .hint {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 0.35rem;
  }
  .checkbox-group {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 0.6rem;
  }
  .checkbox-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--bg);
    padding: 0.6rem 0.8rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.88rem;
    transition: background 0.2s;
  }
  .checkbox-item:hover { background: #eef2ff; }
  .checkbox-item input { accent-color: var(--primary); }
  .btn {
    width: 100%;
    padding: 0.9rem;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn:active { transform: scale(0.98); }
  .success-msg {
    display: none;
    background: #ecfdf5;
    color: #065f46;
    border: 1px solid #a7f3d0;
    padding: 1rem;
    border-radius: 10px;
    margin-bottom: 1.5rem;
    font-size: 0.9rem;
  }
  .success-msg.visible { display: block; }
  @media (max-width: 480px) {
    .container { padding: 1.5rem; }
  }
</style>
</head>
<body>
  <main class="container">
    <h1>Especificación de la Tarea de Código</h1>
    <p class="subtitle">Describe con detalle la tarea que necesitas desarrollar para que podamos generar el código adecuado.</p>

    <div class="success-msg" id="successMsg">✅ Especificación enviada correctamente. ¡Gracias!</div>

    <form id="taskForm" novalidate>
      <div class="form-group">
        <label for="taskTitle" class="required">Título de la tarea</label>
        <input type="text" id="taskTitle" name="taskTitle" placeholder="Ej: Página de inicio con formulario de contacto" required>
      </div>

      <div class="form-group">
        <label for="techStack">Tecnología principal</label>
        <select id="techStack" name="techStack">
          <option value="html">HTML / CSS / JavaScript</option>
          <option value="react">React</option>
          <option value="vue">Vue.js</option>
          <option value="angular">Angular</option>
          <option value="node">Node.js</option>
          <option value="python">Python</option>
          <option value="php">PHP</option>
          <option value="otro">Otro</option>
        </select>
      </div>

      <div class="form-group">
        <label class="required">Funcionalidades necesarias</label>
        <div class="checkbox-group">
          <label class="checkbox-item"><input type="checkbox" name="features" value="responsive"> Diseño responsive</label>
          <label class="checkbox-item"><input type="checkbox" name="features" value="forms"> Formularios</label>
          <label class="checkbox-item"><input type="checkbox" name="features" value="api"> Consumo de API</label>
          <label class="checkbox-item"><input type="checkbox" name="features" value="auth"> Autenticación</label>
          <label class="checkbox-item"><input type="checkbox" name="features" value="bd"> Base de datos</label>
          <label class="checkbox-item"><input type="checkbox" name="features" value="anim"> Animaciones</label>
        </div>
      </div>

      <div class="form-group">
        <label for="priority">Prioridad</label>
        <select id="priority" name="priority">
          <option value="alta">Alta</option>
          <option value="media" selected>Media</option>
          <option value="baja">Baja</option>
        </select>
      </div>

      <div class="form-group">
        <label for="description" class="required">Descripción detallada</label>
        <textarea id="description" name="description" placeholder="Explica el objetivo, comportamiento esperado, restricciones, estilos de diseño, ejemplos de uso..." required></textarea>
        <p class="hint">Incluye todo detalle relevante: colores, estructuras, interacciones y casos de error.</p>
      </div>

      <div class="form-group">
        <label for="deadline">Fecha límite (opcional)</label>
        <input type="date" id="deadline" name="deadline">
      </div>

      <button type="submit" class="btn">Enviar especificación</button>
    </form>
  </main>

  <script>
    document.getElementById('taskForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const title = document.getElementById('taskTitle').value.trim();
      const description = document.getElementById('description').value.trim();

      if (!title || !description) {
        alert('Por favor, completa el título y la descripción de la tarea.');
        return;
      }

      const features = [...document.querySelectorAll('input[name="features"]:checked')]
        .map(cb => cb.value);

      const spec = {
        titulo: title,
        tecnologia: document.getElementById('techStack').value,
        funcionalidades: features,
        prioridad: document.getElementById('priority').value,
        descripcion: description,
        fechaLimite: document.getElementById('deadline').value || null
      };

      console.log('Especificación recibida:', spec);

      const msg = document.getElementById('successMsg');
      msg.classList.add('visible');
      this.reset();

      setTimeout(() => msg.classList.remove('visible'), 5000);
    });
  </script>
</body>
</html>
