<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Proyecto | VISANTIC</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <style>
        :root { --primary-blue: #058EA6; --primary-dark: #046978; --bg-color: #f8fafc; --text-main: #1e293b; --text-muted: #64748b; --border-color: #e2e8f0; --success: #10b981; --danger: #dc2626; }
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: var(--bg-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: white; border-bottom: 1px solid var(--border-color); z-index: 50; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .menu-btn { background: none; border: none; cursor: pointer; color: var(--text-main); }
        .header-title { margin: 0; font-size: 15px; font-weight: 700; color: var(--primary-blue); }
        .user-initial { width: 35px; height: 35px; border-radius: 50%; background-color: var(--primary-blue); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 260px; background: white; border-right: 1px solid var(--border-color); overflow-y: auto; transition: transform 0.3s ease; display: flex; flex-direction: column; position: fixed; height: calc(100vh - 60px); z-index: 40; }
        @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .sidebar.open { transform: translateX(0); } }
        .content { flex: 1; padding: 20px; overflow-y: auto; margin-left: 0; width: 100%; }
        @media (min-width: 769px) { .content { margin-left: 260px; } }
        .container { max-width: 800px; margin: 0 auto; }
        .form-card { background: #FFFFFF; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: 0 4px 10px rgba(0,0,0,0.03); margin-bottom: 24px; padding: 24px; border-left: 4px solid var(--primary-blue); }
        .section-title-form { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; color: var(--primary-blue); margin: 0 0 20px 0; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
        .form-input, .form-select { width: 100%; padding: 14px 16px; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; color: var(--text-main); box-sizing: border-box; font-family: inherit; outline: none; transition: all 0.2s ease; }
        .form-input:focus, .form-select:focus { background-color: #FFFFFF; border-color: var(--primary-blue); box-shadow: 0 0 0 3px rgba(5, 142, 166, 0.1); }
        .grid-2 { display: grid; grid-template-columns: 1fr; gap: 16px; }
        @media (min-width: 768px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
        .btn-guardar { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 15px 20px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; background: var(--primary-blue); color: white; border: none; width: 100%; max-width: 300px; margin: 0 auto; }
        .btn-guardar:hover { background: var(--primary-dark); }
        .photo-upload-area { border: 2px dashed #d1d5db; border-radius: 8px; background: #f9fafb; padding: 30px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .photo-upload-area:hover { border-color: var(--primary-blue); background: #f0f9ff; }
        .photo-preview { display: none; width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px; margin-top: 15px; }
        #custom-alert { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 10000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal-card-alert { background: white; border-radius: 12px; padding: 24px; width: 100%; max-width: 400px; text-align: center; }
        #alert-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; color: white; background: var(--primary-blue); font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <button class="menu-btn" id="toggle-menu"><i data-lucide="menu"></i></button>
            <img src="https://i.ibb.co/8ng1078m/LOGOTIPO.png" alt="Logo VISANTIC" style="height: 35px; object-fit: contain;">
            <h1 class="header-title">Alta de Proyecto</h1>
        </div>
        <div class="user-initial" id="user-initial">U</div>
    </header>

    <div class="main-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="content">
            <div class="container">
                <div style="margin-bottom: 25px; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; text-align: center;">
                    <h1 style="font-size: 24px; color: var(--primary-blue); margin: 0 0 5px 0; font-weight: 800; text-transform: uppercase;">Nuevo Proyecto</h1>
                    <p style="color: var(--text-muted); margin: 0; font-size: 14px;">Ingresa los datos del proyecto u obra</p>
                </div>

                <form onsubmit="guardarProyecto(event)">
                    <div class="form-card">
                        <h3 class="section-title-form"><i data-lucide="briefcase"></i> Datos del Proyecto</h3>
                        
                        <div class="form-group">
                            <label class="form-label">Cliente</label>
                            <input type="text" class="form-input" id="cliente" placeholder="Nombre del cliente o empresa" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Proyecto / Obra</label>
                            <input type="text" class="form-input" id="proyecto" placeholder="Nombre del proyecto" required>
                        </div>

                        <div class="grid-2">
                            <div class="form-group">
                                <label class="form-label">Fecha de Inicio</label>
                                <input type="date" class="form-input" id="fecha_inicio" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Fecha de Término</label>
                                <input type="date" class="form-input" id="fecha_termino" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-card">
                        <h3 class="section-title-form"><i data-lucide="image"></i> Fotografía del Proyecto</h3>
                        <input type="file" id="file_portada" accept="image/*" style="display:none" onchange="previewPhoto(event)">
                        <div class="photo-upload-area" onclick="document.getElementById('file_portada').click()">
                            <i data-lucide="upload-cloud" style="color: var(--text-muted); width: 40px; height: 40px;"></i>
                            <p style="margin: 10px 0 0 0; font-weight: 600; color: var(--text-main);">Haz clic para subir una foto</p>
                            <p style="margin: 5px 0 0 0; font-size: 12px; color: var(--text-muted);">Esta será la imagen principal del proyecto</p>
                        </div>
                        <img id="preview_img" class="photo-preview" alt="Vista previa">
                    </div>

                    <div style="display: flex; justify-content: center; padding-bottom: 40px;">
                        <button type="submit" class="btn-guardar" id="btnGuardar"><i data-lucide="save"></i> Guardar Proyecto</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <div id="custom-alert">
        <div class="modal-card-alert">
            <h3 id="alert-title" style="margin: 0 0 8px 0; font-size: 18px; color: var(--text-main); font-weight: 700;"></h3>
            <p id="alert-msg" style="margin: 0 0 24px 0; font-size: 14px; color: var(--text-muted);"></p>
            <button id="alert-btn" onclick="closeAlert()">Aceptar</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBjlemFwGQbA3mM7UhOZAVGaam1z1Xixr8",
            authDomain: "loretoapp-2ca14.firebaseapp.com",
            projectId: "loretoapp-2ca14",
            storageBucket: "loretoapp-2ca14.firebasestorage.app",
            messagingSenderId: "794212467801",
            appId: "1:794212467801:web:f0bf6fd01579f0aec35d48"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const storage = firebase.storage();

        document.addEventListener('DOMContentLoaded', () => {
            if(!localStorage.getItem('usuario')) { window.location.href = 'index.html'; return; }
            document.getElementById('user-initial').innerText = (localStorage.getItem('nombre') || 'U').charAt(0).toUpperCase();

            fetch('menu.html?v=4').then(res => res.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html; lucide.createIcons();
                document.getElementById('link-nuevo-proyecto')?.classList.add('active');
            });
            document.getElementById('toggle-menu').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
            lucide.createIcons();
        });

        function showAlert(t, m) {
            document.getElementById('alert-title').innerText = t;
            document.getElementById('alert-msg').innerText = m;
            document.getElementById('custom-alert').style.display = 'flex';
        }
        function closeAlert() { document.getElementById('custom-alert').style.display = 'none'; }

        let filePortada = null;
        function previewPhoto(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('preview_img').src = e.target.result;
                document.getElementById('preview_img').style.display = 'block';
                filePortada = file;
            };
            reader.readAsDataURL(file);
        }

        async function guardarProyecto(event) {
            event.preventDefault();
            const btn = document.getElementById('btnGuardar');
            btn.disabled = true; btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin"></i> Guardando...';
            lucide.createIcons();

            try {
                let urlPortada = "";
                if (filePortada) {
                    const storageRef = storage.ref();
                    const fileRef = storageRef.child(`proyectos_portada/${Date.now()}_${filePortada.name}`);
                    const snapshot = await fileRef.put(filePortada);
                    urlPortada = await snapshot.ref.getDownloadURL();
                }

                await db.collection("proyectos").add({
                    cliente: document.getElementById('cliente').value,
                    proyecto: document.getElementById('proyecto').value,
                    fecha_inicio: document.getElementById('fecha_inicio').value,
                    fecha_termino: document.getElementById('fecha_termino').value,
                    url_portada: urlPortada,
                    fecha_creacion: new Date().toISOString()
                });
                
                showAlert("Éxito", "Proyecto guardado correctamente.");
                setTimeout(() => window.location.href = 'proyectos.html', 1500);
            } catch (e) {
                console.error(e);
                showAlert("Error", "No se pudo guardar el proyecto.");
                btn.disabled = false; btn.innerHTML = '<i data-lucide="save"></i> Guardar Proyecto';
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
