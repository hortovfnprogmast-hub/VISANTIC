<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyectos | VISANTIC</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { --primary-blue: #058EA6; --light-blue: #e0f2fe; --bg-color: #f8fafc; --text-main: #1e293b; --text-muted: #64748b; --border-color: #e2e8f0; --danger: #dc2626; }
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: var(--bg-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: white; border-bottom: 1px solid var(--border-color); z-index: 50; position: sticky; top: 0; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .menu-btn { background: none; border: none; cursor: pointer; color: var(--text-main); }
        .header-title { margin: 0; font-size: 15px; font-weight: 700; color: var(--primary-blue); }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .user-name-top { font-weight: 700; color: var(--primary-blue); font-size: 14px; }
        .user-initial { width: 35px; height: 35px; border-radius: 50%; background-color: var(--primary-blue); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 260px; background: white; border-right: 1px solid var(--border-color); overflow-y: auto; transition: transform 0.3s ease; display: flex; flex-direction: column; position: fixed; height: calc(100vh - 60px); z-index: 40; }
        @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .sidebar.open { transform: translateX(0); } }
        .content { flex: 1; padding: 20px; overflow-y: auto; margin-left: 0; width: 100%; }
        @media (min-width: 769px) { .content { margin-left: 260px; } }
        .container { max-width: 1200px; margin: 0 auto; }
        .table-container { background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid var(--border-color); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; text-align: left; }
        thead { background: var(--light-blue); border-bottom: 1px solid var(--border-color); }
        th, td { padding: 16px 20px; font-size: 14px; color: var(--text-main); }
        th { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
        tbody tr { border-bottom: 1px solid #f1f5f9; }
        tbody tr:hover { background-color: #f8fafc; }
        .badge-count { background: var(--primary-blue); color: white; padding: 4px 12px; border-radius: 12px; font-weight: 700; font-size: 12px; text-decoration: none; display: inline-block; }
        .btn-edit-red { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; font-size: 13px; text-decoration: none; }
        
        /* BOTÓN FLOTANTE PARA ELIMINAR */
        .fab-delete { position: fixed; bottom: 30px; right: 30px; background: var(--danger); color: white; border: none; border-radius: 50%; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 999; transition: transform 0.2s; }
        .fab-delete:hover { background: #b91c1c; transform: scale(1.1); }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <button class="menu-btn" id="toggle-menu"><i data-lucide="menu"></i></button>
            <img src="https://i.ibb.co/8ng1078m/LOGOTIPO.png" alt="Logo VISANTIC" style="height: 35px; object-fit: contain;">
            <h1 class="header-title">Proyectos</h1>
        </div>
        <div class="header-right">
            <span class="user-name-top" id="header-username">Cargando...</span>
            <div class="user-initial" id="user-initial">U</div>
        </div>
    </header>

    <div class="main-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="content">
            <div class="container">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 24px;">
                    <div>
                        <h1 style="font-size: 24px; font-weight: bold; margin: 0; color: var(--text-main);">Listado de Proyectos</h1>
                        <p style="color: var(--text-muted); margin: 5px 0 0 0;">Visualiza, edita o elimina los proyectos</p>
                    </div>
                    <a href="proyectonuevo.html" style="background: var(--primary-blue); color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;">
                        <i data-lucide="plus-circle" style="width: 18px;"></i> Nuevo Proyecto
                    </a>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 40px;"><input type="checkbox" id="check-all-proy" onclick="toggleAll(this)"></th>
                                <th>Cliente</th>
                                <th>Proyecto</th>
                                <th>Inicio</th>
                                <th>Término</th>
                                <th style="text-align: center;">Reportes</th>
                                <th style="text-align: center;">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-proyectos">
                            <tr><td colspan="7" style="text-align: center; padding: 40px; color: var(--text-muted);">Cargando proyectos...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <button class="fab-delete" onclick="eliminarProyectosSeleccionados()" title="Eliminar Seleccionados">
        <i data-lucide="trash-2" style="width: 24px; height: 24px;"></i>
    </button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBjlemFwGQbA3mM7UhOZAVGaam1z1Xixr8",
            authDomain: "loretoapp-2ca14.firebaseapp.com",
            projectId: "loretoapp-2ca14",
            storageBucket: "loretoapp-2ca14.firebasestorage.app",
            messagingSenderId: "794212467801",
            appId: "1:794212467801:web:f0bf6fd01579f0aec35d48"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        function configurarPermisosMenu() {
            const privilegio = localStorage.getItem('privilegio');
            const menuMisReportes = document.getElementById('menu-mis-reportes');
            const menuAdmin = document.getElementById('menu-administracion');
            const menuGlobal = document.getElementById('menu-reportes-compania');
            if (privilegio === '1') {
                if(menuMisReportes) menuMisReportes.style.display = 'none';
                if(menuAdmin) menuAdmin.style.display = 'block';
                if(menuGlobal) menuGlobal.style.display = 'block';
            } else {
                if(menuMisReportes) menuMisReportes.style.display = 'block';
                if(menuAdmin) menuAdmin.style.display = 'none';
                if(menuGlobal) menuGlobal.style.display = 'none';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if(!localStorage.getItem('usuario')) { window.location.href = 'index.html'; return; }
            const nombre = localStorage.getItem('nombre') || 'Usuario';
            document.getElementById('user-initial').innerText = nombre.charAt(0).toUpperCase();
            document.getElementById('header-username').innerText = nombre;

            fetch('menu.html?v=8').then(res => res.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html;
                configurarPermisosMenu();
                lucide.createIcons();
                document.getElementById('link-proyectos')?.classList.add('active');
            });
            document.getElementById('toggle-menu').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
            
            cargarDatos();
            lucide.createIcons();
        });

        function toggleAll(source) {
            document.querySelectorAll('.check-proy').forEach(cb => cb.checked = source.checked);
        }

        async function cargarDatos() {
            try {
                const snapProy = await db.collection("proyectos").get();
                let proyectos = [];
                snapProy.forEach(doc => proyectos.push({ id: doc.id, ...doc.data() }));
                
                const snapRep = await db.collection("reportes_semanales").where("estado", "==", "En proceso").get();
                let conteoReportes = {};
                snapRep.forEach(doc => {
                    const p = doc.data().proyecto || "Sin Nombre";
                    conteoReportes[p] = (conteoReportes[p] || 0) + 1;
                });

                const tbody = document.getElementById('tabla-proyectos');
                tbody.innerHTML = '';

                if (proyectos.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 40px; color: var(--text-muted);">No hay proyectos.</td></tr>`;
                    return;
                }

                proyectos.forEach(p => {
                    const numRep = conteoReportes[p.proyecto] || 0;
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><input type="checkbox" class="check-proy" data-id="${p.id}"></td>
                        <td>${p.cliente || ''}</td>
                        <td style="font-weight: 600;">${p.proyecto || ''}</td>
                        <td>${p.fecha_inicio || ''}</td>
                        <td>${p.fecha_termino || ''}</td>
                        <td style="text-align: center;">
                            <a href="reporte_semanal.html?tab=realizados&scope=global&proyecto=${encodeURIComponent(p.proyecto)}" class="badge-count">${numRep}</a>
                        </td>
                        <td style="text-align: center;">
                            <a href="proyectonuevo.html?edit=${p.id}" class="btn-edit-red"><i data-lucide="edit"></i> Editar</a>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
                lucide.createIcons();
            } catch (e) { console.error(e); }
        }

        async function eliminarProyectosSeleccionados() {
            const checks = document.querySelectorAll('.check-proy:checked');
            if (checks.length === 0) { alert("Selecciona al menos un proyecto para eliminar."); return; }
            if (!confirm(`¿Seguro que deseas eliminar ${checks.length} proyecto(s)? Esta acción no se puede deshacer.`)) return;

            try {
                for (let check of checks) {
                    await db.collection("proyectos").doc(check.dataset.id).delete();
                }
                alert("Proyectos eliminados correctamente.");
                cargarDatos();
            } catch (e) { alert("Error al eliminar: " + e.message); }
        }
    </script>
</body>
</html>
