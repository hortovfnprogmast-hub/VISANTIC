<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reporte Semanal | VISANTIC</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <style>
        :root { --primary-blue: #058EA6; --light-blue: #e0f2fe; --bg-color: #f8fafc; --text-main: #1e293b; --text-muted: #64748b; --border-color: #e2e8f0; --danger: #dc2626; --success: #10b981; }
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: var(--bg-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: white; border-bottom: 1px solid var(--border-color); z-index: 50; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .menu-btn { background: none; border: none; cursor: pointer; color: var(--text-main); }
        .header-title { margin: 0; font-size: 15px; font-weight: 700; color: var(--primary-blue); }
        .user-initial { width: 35px; height: 35px; border-radius: 50%; background-color: var(--primary-blue); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 260px; background: white; border-right: 1px solid var(--border-color); overflow-y: auto; transition: transform 0.3s ease; display: flex; flex-direction: column; }
        @media (max-width: 768px) { .sidebar { position: fixed; height: calc(100vh - 60px); transform: translateX(-100%); z-index: 40; } .sidebar.open { transform: translateX(0); } .header-title { display: none; } }
        .content { flex: 1; padding: 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .container { max-width: 900px; margin: 0 auto; padding-bottom: 50px; }
        .form-card { background: #FFFFFF; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: 0 4px 10px rgba(0,0,0,0.03); margin-bottom: 24px; padding: 24px; }
        .section-title-form { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; color: var(--primary-blue); margin: 0 0 20px 0; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
        .form-input, .form-select, textarea.form-input { width: 100%; padding: 14px 16px; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; color: var(--text-main); box-sizing: border-box; font-family: inherit; outline: none; transition: all 0.2s ease; }
        .form-input:focus, .form-select:focus, textarea.form-input:focus { background-color: #FFFFFF; border-color: var(--primary-blue); box-shadow: 0 0 0 3px rgba(5, 142, 166, 0.1); }
        .form-input[readonly] { background-color: #f1f5f9; color: var(--text-muted); }
        .btn-guardar { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 15px 20px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; background: var(--success); color: white; border: none; width: 100%; }
        .btn-enviar { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 15px 20px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; background: var(--primary-blue); color: white; border: none; width: 100%; }
        .photo-controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .btn-photo, .btn-photo-secondary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 14px; transition: all 0.2s; }
        .btn-photo { background: var(--primary-blue); color: white; border: none; }
        .btn-photo:hover { background: #046978; }
        .btn-photo-secondary { background: white; color: #374151; border: 1px solid #d1d5db; }
        .photo-grid-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 15px; }
        .photo-slot { aspect-ratio: 1; border: 2px dashed #d1d5db; border-radius: 8px; background: #f9fafb; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .photo-slot img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
        .remove-photo { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.6); color: white; border-radius: 50%; width: 24px; height: 24px; text-align: center; line-height: 22px; cursor: pointer; font-size: 16px; font-weight: bold; z-index: 10; }
        #custom-alert { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 10000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal-card-alert { background: white; border-radius: 12px; padding: 24px; width: 100%; max-width: 400px; text-align: center; }
        #alert-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; color: white; background: var(--primary-blue); font-weight: 700; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <button class="menu-btn" id="toggle-menu"><i data-lucide="menu"></i></button>
            <img src="https://i.ibb.co/8ng1078m/LOGOTIPO.png" alt="Logo VISANTIC" style="height: 35px; object-fit: contain;">
            <h1 class="header-title">Nuevo Reporte</h1>
        </div>
        <div class="user-initial" id="user-initial-header">U</div>
    </header>

    <div class="main-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="content">
            <div class="container">
                <form id="ordenMttoForm">
                    <div class="form-card" style="border-left: 4px solid var(--primary-blue);">
                        <h3 class="section-title-form"><i data-lucide="briefcase"></i> Información General</h3>
                        <div class="form-group">
                            <label class="form-label">Proyecto</label>
                            <select class="form-select" id="proyecto-select" required>
                                <option value="">Selecciona un proyecto...</option>
                            </select>
                            <input type="hidden" id="proyecto-id">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Ubicación (Dirección)</label>
                            <input type="text" class="form-input" id="ubicacion-input" readonly placeholder="Se llenará automáticamente">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Folio de Reporte</label>
                            <input type="text" class="form-input" id="folio-reporte" readonly placeholder="Se generará al guardar">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Fecha y Hora</label>
                            <input type="text" class="form-input" id="fecha-hora" readonly>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Frente de Trabajo</label>
                            <input type="text" class="form-input" id="frente-trabajo" placeholder="Ej: Zona Norte, Cimentación, etc." required>
                        </div>
                    </div>

                    <div class="form-card">
                        <h3 class="section-title-form"><i data-lucide="clipboard-list"></i> Descripción de Actividades o Contingencias</h3>
                        <div class="form-group">
                            <textarea class="form-input" id="descripcion" rows="5" placeholder="Describe las actividades realizadas o contingencias..." required></textarea>
                        </div>
                    </div>

                    <div class="form-card">
                        <h3 class="section-title-form"><i data-lucide="camera"></i> Evidencia Fotográfica (1 a 6 fotos)</h3>
                        <div class="photo-controls">
                            <button type="button" class="btn-photo" onclick="triggerCamera()"><i data-lucide="camera"></i> Toma Foto</button>
                            <button type="button" class="btn-photo-secondary" onclick="triggerFile()"><i data-lucide="upload"></i> Subir Archivo</button>
                        </div>
                        <div id="photoGrid" class="photo-grid-slots">
                            <div class="photo-slot" id="slot-0"><i data-lucide="image" style="color:#ccc; width:30px; height:30px;"></i></div>
                            <div class="photo-slot" id="slot-1"><i data-lucide="image" style="color:#ccc; width:30px; height:30px;"></i></div>
                            <div class="photo-slot" id="slot-2"><i data-lucide="image" style="color:#ccc; width:30px; height:30px;"></i></div>
                            <div class="photo-slot" id="slot-3"><i data-lucide="image" style="color:#ccc; width:30px; height:30px;"></i></div>
                            <div class="photo-slot" id="slot-4"><i data-lucide="image" style="color:#ccc; width:30px; height:30px;"></i></div>
                            <div class="photo-slot" id="slot-5"><i data-lucide="image" style="color:#ccc; width:30px; height:30px;"></i></div>
                        </div>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 10px; max-width: 400px; margin-left: auto; margin-right: auto; padding-bottom: 40px;">
                        <button type="button" class="btn-enviar" onclick="guardarReporte()"><i data-lucide="save"></i> Guardar y Generar PDF</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <input type="file" id="fileInputGlobal" accept="image/*" style="display:none" onchange="processFile(this)">
    <canvas id="tempCanvas" style="display:none"></canvas>
    <div id="custom-alert"><div class="modal-card-alert"><h3 id="alert-title" style="margin:0 0 8px 0;font-size:18px;color:var(--text-main);font-weight:700;"></h3><p id="alert-msg" style="margin:0 0 24px 0;font-size:14px;color:var(--text-muted);"></p><button id="alert-btn" onclick="closeAlert()">Aceptar</button></div></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBjlemFwGQbA3mM7UhOZAVGaam1z1Xixr8",
            authDomain: "loretoapp-2ca14.firebaseapp.com",
            projectId: "loretoapp-2ca14",
            storageBucket: "loretoapp-2ca14.firebasestorage.app",
            messagingSenderId: "794212467801",
            appId: "1:794212467801:web:f0bf6fd01579f0aec35d48"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        let fotos = [null, null, null, null, null, null];
        let proyectosCache = [];

        document.addEventListener('DOMContentLoaded', () => {
            if(!localStorage.getItem('usuario')) { window.location.href = 'index.html'; return; }
            document.getElementById('user-initial-header').innerText = (localStorage.getItem('nombre') || 'U').charAt(0).toUpperCase();
            
            fetch('menu.html?v=4').then(res => res.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html; lucide.createIcons();
                document.getElementById('link-reporte-semanal')?.classList.add('active');
            });
            document.getElementById('toggle-menu').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
            
            // Llenar fecha y hora actual
            document.getElementById('fecha-hora').value = new Date().toLocaleString('es-MX');
            
            cargarProyectos();
            lucide.createIcons();
        });

        function showAlert(t, m) { document.getElementById('alert-title').innerText = t; document.getElementById('alert-msg').innerText = m; document.getElementById('custom-alert').style.display = 'flex'; }
        function closeAlert() { document.getElementById('custom-alert').style.display = 'none'; }

        async function cargarProyectos() {
            try {
                const snap = await db.collection("proyectos").get();
                const select = document.getElementById('proyecto-select');
                snap.forEach(doc => {
                    const p = doc.data();
                    proyectosCache[doc.id] = p;
                    const option = document.createElement('option');
                    option.value = doc.id;
                    option.innerText = p.proyecto || 'Sin nombre';
                    select.appendChild(option);
                });
            } catch (e) { console.error(e); }
        }

        document.getElementById('proyecto-select').addEventListener('change', function() {
            const id = this.value;
            if(id && proyectosCache[id]) {
                document.getElementById('ubicacion-input').value = proyectosCache[id].direccion_completa || 'Sin dirección';
                document.getElementById('proyecto-id').value = id;
            } else {
                document.getElementById('ubicacion-input').value = '';
                document.getElementById('proyecto-id').value = '';
            }
        });

        function triggerFile() { if(fotos.filter(f => f !== null).length < 6) document.getElementById('fileInputGlobal').click(); else showAlert("Límite", "Máximo 6 fotos.", false); }
        function processFile(i) {
            if(!i.files || i.files.length === 0) return;
            const r = new FileReader();
            r.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const c = document.createElement('canvas');
                    let w = img.width, h = img.height; const m = 800;
                    if(w > m || h > m) { if(w > h) { h = (h/w)*m; w = m; } else { w = (w/h)*m; h = m; } }
                    c.width = w; c.height = h;
                    c.getContext('2d').drawImage(img, 0, 0, w, h);
                    const f = c.toDataURL('image/jpeg', 0.7);
                    const s = fotos.findIndex(f => f === null);
                    if(s > -1) { fotos[s] = f; renderSlots(); }
                    i.value = '';
                };
                img.src = e.target.result;
            };
            r.readAsDataURL(i.files[0]);
        }

        function removeFoto(i) { fotos[i] = null; renderSlots(); }
        function renderSlots() {
            for(let i = 0; i < 6; i++) {
                const s = document.getElementById(`slot-${i}`); if(!s) continue;
                if(fotos[i]) {
                    s.innerHTML = `<img src="${fotos[i]}" style="width:100%;height:100%;object-fit:cover;border-radius:8px"><span class="remove-photo" onclick="removeFoto(${i})">&times;</span>`;
                    s.style.border = "1px solid var(--border-color)";
                } else {
                    s.innerHTML = `<i data-lucide="image" style="color:#ccc;width:30px;height:30px"></i>`;
                    s.style.border = "2px dashed #d1d5db";
                }
            }
            lucide.createIcons();
        }

        // OBTENER UBICACIÓN GPS
        function getGPS() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve("Ubicación no soportada");
                } else {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => resolve(`Lat: ${pos.coords.latitude.toFixed(4)}, Long: ${pos.coords.longitude.toFixed(4)}`),
                        () => resolve("Ubicación no disponible (Permiso denegado)")
                    );
                }
            });
        }

        async function guardarReporte() {
            const projId = document.getElementById('proyecto-id').value;
            const desc = document.getElementById('descripcion').value;
            const frente = document.getElementById('frente-trabajo').value;
            const fotosValidas = fotos.filter(f => f !== null);

            if(!projId || !desc || !frente) { showAlert("Atención", "Completa Proyecto, Frente de Trabajo y Descripción.", false); return; }
            if(fotosValidas.length < 1) { showAlert("Atención", "Debes subir al menos 1 fotografía.", false); return; }

            try {
                // GENERAR FOLIO CONSECUTIVO POR PROYECTO
                const projRef = db.collection('proyectos').doc(projId);
                let nuevoFolio = "";
                await db.runTransaction(async (t) => {
                    const doc = await t.get(projRef);
                    if (!doc.exists) throw "Proyecto no encontrado";
                    let count = doc.data().folio_contador || 0;
                    count++;
                    t.update(projRef, { folio_contador: count });
                    nuevoFolio = count.toString().padStart(3, '0'); // Formato 001
                });

                const gps = await getGPS();
                const fechaHora = new Date().toLocaleString('es-MX');

                // GUARDAR EN FIRESTORE
                const reporteRef = db.collection("reportes_semanales").doc();
                await reporteRef.set({
                    id_proyecto: projId,
                    proyecto: proyectosCache[projId].proyecto,
                    cliente: proyectosCache[projId].cliente,
                    contrato: proyectosCache[projId].numero_documento || proyectosCache[projId].tipo_documento || '',
                    direccion: proyectosCache[projId].direccion_completa,
                    folio: nuevoFolio,
                    fecha_hora: fechaHora,
                    frente_trabajo: frente,
                    descripcion: desc,
                    fotos: fotosValidas,
                    ubicacion_gps: gps,
                    residente_id: localStorage.getItem('usuario'),
                    fecha_creacion: new Date().toISOString()
                });

                // PREPARAR DATOS PARA PDF
                const datosPDF = {
                    cliente: proyectosCache[projId].cliente,
                    proyecto: proyectosCache[projId].proyecto,
                    contrato: proyectosCache[projId].numero_documento || '',
                    url_portada: proyectosCache[projId].url_portada || '',
                    fecha_hora: fechaHora,
                    folio: nuevoFolio,
                    frente_trabajo: frente,
                    descripcion: desc,
                    fotos: fotosValidas,
                    ubicacion_gps: gps
                };

                sessionStorage.setItem('DatosReportePDF', JSON.stringify(datosPDF));
                showAlert("Éxito", "Reporte guardado. Generando PDF...", true);
                setTimeout(() => {
                    window.open('PDFdereporsem.html', '_blank');
                    // limpiar formulario
                    document.getElementById('ordenMttoForm').reset();
                    fotos = [null, null, null, null, null, null];
                    renderSlots();
                }, 1500);

            } catch (error) {
                console.error(error);
                showAlert("Error", "No se pudo guardar el reporte: " + error, false);
            }
        }
    </script>
</body>
</html>
